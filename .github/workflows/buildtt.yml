name: Build TikTok IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted TikTok IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "TikTok"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID (Optional)"
        default: "com.zhiliaoapp.musically"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SDK_VERSION: '18.6'
      ZXPI_MIN_IOS: '14.0'

    steps:
      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: display_name,bundle_id

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and Validate IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          download() {
            rm -f "$2"
            if wget --quiet --no-verbose --tries=3 --waitretry=2 -O "$2" "$1"; then
              return 0
            fi
            echo "::warning::wget failed for $2, retrying with curl"
            rm -f "$2"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 -o "$2" "$1"
          }
          download "$IPA_URL" app.ipa
          file_type=$(file --mime-type -b app.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Get App Version
        run: |
          plist_entry="$(unzip -Z1 app.ipa | grep -m1 -E '^Payload/[^/]+\.app/Info\.plist$' || true)"
          if [[ -z "$plist_entry" ]]; then
            echo "::error::Could not find app bundle in Payload/"
            exit 1
          fi
          plist_dir="$RUNNER_TEMP/appplist"
          mkdir -p "$plist_dir"
          unzip -q -j -o app.ipa "$plist_entry" -d "$plist_dir"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$plist_dir/Info.plist" | tr -d '\r\n' | tr -c 'A-Za-z0-9._+~-' '_')"
          rm -rf "$plist_dir"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read CFBundleShortVersionString from the IPA's Info.plist"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Get Tweak Version
        run: |
          shopt -s nullglob
          files=(resources/com.gtok.rootless_*.deb)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::Tweak file not found for GTok (expected resources/com.gtok.rootless_*.deb)"
            exit 1
          fi
          DEB_FILE="${files[0]}"
          VERSION=$(echo "$DEB_FILE" | sed -E 's/.*com\.gtok\.rootless_([^_]+)_iphoneos-arm64\.deb/\1/')
          if [[ -z "$VERSION" || "$VERSION" == *"/"* ]]; then
            echo "::error::Could not extract version from $DEB_FILE"
            exit 1
          fi
          VERSION="$(printf '%s' "$VERSION" | tr -c 'A-Za-z0-9._+~-' '_')"
          echo "TWEAK_DEB=$DEB_FILE" >> "$GITHUB_ENV"
          echo "TWEAK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Selected tweak: GTok → $DEB_FILE (v$VERSION)"

      - name: Cache zxPluginsInject
        id: zx_cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/zxPluginsInject.dylib
          key: zxPluginsInject-${{ runner.os }}-v1

      - name: Install Dependencies
        if: steps.zx_cache.outputs.cache-hit != 'true'
        run: brew install make ldid

      - name: Set PATH Environment Variables
        if: steps.zx_cache.outputs.cache-hit != 'true'
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"

      - name: Cache Theos
        if: steps.zx_cache.outputs.cache-hit != 'true'
        id: theos_cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}

      - name: Install Theos
        if: steps.zx_cache.outputs.cache-hit != 'true' && steps.theos_cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Download iOS SDK
        if: steps.zx_cache.outputs.cache-hit != 'true' && steps.theos_cache.outputs.cache-hit != 'true'
        run: |
          sdk_repo="$RUNNER_TEMP/iOS-SDKs"
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git "$sdk_repo"
          cd "$sdk_repo"
          git sparse-checkout set --no-cone "iPhoneOS${SDK_VERSION}.sdk"
          git checkout
          mkdir -p "$THEOS/sdks"
          mv "iPhoneOS${SDK_VERSION}.sdk" "$THEOS/sdks/"
          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"
          rm -rf "$sdk_repo"

      - name: Clone and Build zxPluginsInject
        if: steps.zx_cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth=1 --recurse-submodules https://github.com/royerlraph79/zxPluginsInject.git
          cd zxPluginsInject && make FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:${SDK_VERSION}:${ZXPI_MIN_IOS}
          mv .theos/obj/*.dylib ${{ github.workspace }}/zxPluginsInject.dylib

      - name: Install cyan
        run: |
          if ! command -v cyan &> /dev/null; then
            pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          fi

      - name: Clone OpenTikTokSafariExtension
        run: |
          git clone --quiet --depth=1 https://github.com/BillyCurtis/OpenTikTokSafariExtension.git
          if [[ ! -d "OpenTikTokSafariExtension/OpenTikTokSafariExtension.appex" ]]; then
            echo "::error::OpenTikTokSafariExtension.appex not found after clone!"
            exit 1
          fi

      - name: Inject Into IPA
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
          BUNDLE_ID_INPUT: ${{ inputs.bundle_id }}
        run: |
          tweaks=(
            "zxPluginsInject.dylib"
            "$TWEAK_DEB"
            "OpenTikTokSafariExtension/OpenTikTokSafariExtension.appex"
          )
          for t in "${tweaks[@]}"; do
            if [[ ! -e "$t" ]]; then
              echo "::error::Tweak/extension file $t not found!"
              exit 1
            fi
          done
          bundle_id="${BUNDLE_ID_INPUT:-com.zhiliaoapp.musically}"
          safe_name="$(printf '%s' "$DISPLAY_NAME" | tr '/' '_')"
          if [[ -z "$safe_name" ]]; then
            safe_name="TikTok"
          fi
          ipa_name="${safe_name}_${APP_VERSION}_${TWEAK_VERSION}.ipa"
          cyan -i app.ipa \
            -o "$ipa_name" \
            -f "${tweaks[@]}" \
            -n "$DISPLAY_NAME" \
            -b "$bundle_id"
          echo "IPA_NAME=$ipa_name" >> "$GITHUB_ENV"

      - name: Create a Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          i=1
          while gh release view "tt-ipa${i}" --repo "$GITHUB_REPOSITORY" &>/dev/null; do
            i=$(( i + 1 ))
          done
          gh release create "tt-ipa${i}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${DISPLAY_NAME}_${APP_VERSION}_${TWEAK_VERSION}" \
            --draft \
            "$IPA_NAME"

      - name: Job Summary
        run: |
          {
            echo '### 🛠️ Build IPA Complete!'
            echo
            echo '### 🚀 Draft Release'
            echo
            echo "Draft release has been created successfully! You can view your release here: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
